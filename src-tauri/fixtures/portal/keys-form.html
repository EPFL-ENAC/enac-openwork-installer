<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create a new key - RCP Portal</title>
</head>
<body>
  <h1>Create a new API key</h1>
  <form method="post" action="/aiaas/keys/new" class="key-form">
    <input type="hidden" name="csrfmiddlewaretoken" value="formCsrfToken456defGHI789">
    <div class="form-group">
      <label for="id_name">Name</label>
      <input type="text" name="name" id="id_name" maxlength="64" required>
    </div>
    <div class="form-group">
      <label for="id_unit">Unit</label>
      <select name="unit" id="id_unit">
        <option value="">---------</option>
        <option value="ENAC-IT">ENAC-IT</option>
        <option value="FSV-LBO">FSV-LBO</option>
        <option value="CIGALE">CIGALE</option>
      </select>
      <p class="help-text">Pick your EPFL unit.</p>
    </div>
    <div class="form-group">
      <label for="id_pool">Pool</label>
      <select name="pool" id="id_pool">
        <option value="Basic" selected>Basic</option>
        <option value="Premium">Premium</option>
      </select>
    </div>
    <div class="form-group">
      <label for="id_usage">Usage</label>
      <select name="usage" id="id_usage">
        <option value="Personal" selected>Personal</option>
        <option value="Unit">Unit</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Create key</button>
  </form>
</body>
</html>
