[package]
name = "epfl-openwork-setup"
version = "0.1.0"
description = "EPFL OpenWork Setup"
edition = "2021"
rust-version = "1.90"

[lib]
name = "epfl_openwork_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
