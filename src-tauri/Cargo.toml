[package]
name = "epfl-openwork-installer"
version = "0.1.0"
description = "EPFL OpenWork Installer"
edition = "2021"
rust-version = "1.90"

[lib]
name = "epfl_openwork_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
scraper = "0.29"
form_urlencoded = "1"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", default-features = false, features = ["time"] }
tauri-plugin-fs = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"
