name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--no-bundle"
            plain: true
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            plain: false
          - platform: ubuntu-latest
            args: "--bundles appimage"
            plain: false
            linux: true
          - platform: ubuntu-24.04-arm
            args: "--bundles appimage"
            plain: false
            linux: true
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EPFL OpenWork Installer ${{ github.ref_name }}"
          releaseBody: "Unsigned build. See the README for install workarounds."
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: ${{ matrix.plain }}
          args: ${{ matrix.args }}
