name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--no-bundle"
            plain: true
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            plain: false
          - platform: ubuntu-latest
            args: "--bundles appimage"
            plain: false
            linux: true
            container: "ubuntu:22.04"
          - platform: ubuntu-24.04-arm
            args: "--bundles appimage"
            plain: false
            linux: true
            container: "ubuntu:22.04"
    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}
    steps:
      # Runs before checkout: the ubuntu:22.04 image has no git, and the container
      # pins the glibc floor (2.35) of every library linuxdeploy bundles.
      - name: Install Linux dependencies in the glibc 2.35 container
        if: matrix.linux
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl file gh git \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf pkg-config wget zstd
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.linux && 'glibc-2.35' || '' }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EPFL OpenWork Installer ${{ github.ref_name }}"
          releaseBody: "Unsigned build. See the README for install workarounds."
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: ${{ matrix.plain }}
          args: ${{ matrix.args }}

      - name: Assert the AppImage glibc floor
        if: matrix.linux
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          appimage=$(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/appimage" -name '*.AppImage' -print -quit)
          test -n "$appimage" || { echo "::error::no AppImage was produced"; exit 1; }
          chmod +x "$appimage"
          "$appimage" --appimage-extract > /dev/null
          webkit=$(find squashfs-root -name 'libwebkit2gtk-4.1.so*' -print -quit)
          test -n "$webkit" || { echo "::error::linuxdeploy did not bundle webkit2gtk-4.1"; exit 1; }
          bash "$GITHUB_WORKSPACE/.github/scripts/glibc-floor.sh" squashfs-root

      - name: Upload the install script to the release
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" src-cli/install.sh --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish SHA256SUMS for every release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          gh release download "$GITHUB_REF_NAME" --dir "$assets" --clobber --repo "$GITHUB_REPOSITORY"
          rm -f "$assets/SHA256SUMS"
          ( cd "$assets" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS" )
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"

  # The asset names embed the build version and the tag does not, so the page is
  # patched from the release metadata after every asset exists.
  deploy-pages:
    needs: [release, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the release tag and asset names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" --json tagName,assets > "$RUNNER_TEMP/release.json"

      - name: Patch the download page
        shell: bash
        run: node scripts/patch-pages.mjs "$RUNNER_TEMP/release.json" pages/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - id: pages
        uses: actions/deploy-pages@v4
